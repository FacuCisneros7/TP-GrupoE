<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../../fonts/fonts.css">
</head>
<body>
    <img class="usuario_idiomas" src="../../img/imagenUsuario.png" alt="usuario_con_idiomas">

    <div class="card">

    <header class="banner">
        <div class="imagotipo">
            <img class="isologo" src="../../img/isotipo-lingoweb.svg" alt="imagotipo">
            <h1>LingoWeb</h1>
        </div>
        <p>Aprende inglés, alemán y chino gratis y de forma divertida</p>
    </header>

    <main class="form">
        <form action="dashboard.html" method="get">

        <div class="campo">
            <label for="usuario">Usuario o email</label>
            <input type="text" id="usuario" name="usuario" required >
        </div>
        
        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required >
        </div>

        <div class="campo">
            <label for="confirm_password">Confirmar contraseña</label>
            <input type="password" id="confirm_password" name="confirm_password" required >
        </div>

        <button class="btn" type="submit">Registrate</button>
        </form>

        <hr>

        <nav>
        <div class="register">
            <p>¿Tienes una cuenta? </p>
            <a href="../index.html">Inicia sesión</a>
        </div>
        </nav>
    </main>

    </div>
</body>
</html>
