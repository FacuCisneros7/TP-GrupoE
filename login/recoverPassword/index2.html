<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover password 2</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../../fonts/fonts.css">
</head>
<body>
    <img class="usuario_idiomas" src="../../img/imagenUsuario.png" alt="usuario_con_idiomas">

    <div class="card">

    <header class="banner">
        <div class="imagotipo">
            <img class="isologo" src="../../img/isotipo-lingoweb.svg" alt="imagotipo">
            <h1>LingoWeb</h1>
        </div>
        <p>Aprende inglés, alemán y chino gratis y de forma divertida</p>
    </header>

    <main class="form">
        <form action="dashboard.html" method="get">
            <p class="ayuda">Se envío a tu email un código de verificación para restaurar la contraseña.</p>

            <div class="campo">
                <label for="codigo">Código de verificación</label>
                <input type="text" id="codigo" name="codigo" required inputmode="numeric">
            </div>

            <a href="index3.html" class="btn">Validar</a>
        </form>

        <hr>

        <nav>
        <div class="register">
            <p>¿Perdiste el código? </p>
            <a href="#">Reenviar</a>
        </div>
        </nav>
    </main>

    </div>
