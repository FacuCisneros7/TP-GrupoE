<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover password 3</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../../fonts/fonts.css">
</head>
<body>
    <img class="usuario_idiomas" src="../../img/imagenUsuario.png" alt="usuario_con_idiomas">

    <div class="card">

    <header class="banner">
        <div class="imagotipo">
            <img class="isologo" src="../../img/isotipo-lingoweb.svg" alt="imagotipo">
            <h1>LingoWeb</h1>
        </div>
        <p>Aprende inglés, alemán y chino gratis y de forma divertida</p>
    </header>

    <main class="form">
        <form action="dashboard.html" method="get">
            <p class="ayuda">Completá los campos con tu contraseña nueva.</p>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required >
            </div>
            
            <div class="campo">
                <label for="confirm_password">Confirmar contraseña</label>
                <input type="password" id="confirm_password" name="confirm_password" required >
            </div>

            <a href="../index.html" class="btn">Confirmar</a>
        </form>

    </main>

    </div>
</body>
</html>
