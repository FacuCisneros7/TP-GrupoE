<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificación</title>
    <link rel="stylesheet" href="../dashboard/style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../fonts/fonts.css">
</head>

<body>

    <header class="header">
        <div class="imagotipo">
            <img class="isologo" src="../img/isotipo-lingoweb.svg" alt="imagotipo">
            <h1>LingoWeb</h1>
        </div>

        <nav class="menu_principal">
            <a href="../dashboard/index.html">Cursos</a>
            <a href="../perfil/index.html">Perfil</a>
            <a href="../ranking/index.html" class="activo">Clasificación</a>
            <a href="../tienda/index.html">Tienda</a>
        </nav>

        <div class="resumen_usuario">
            <span id="racha">🔥 0 Días</span>
            <span id="xp-total">⚡ 0 XP</span>
            <span id="gemas">💎 0</span>
            <a href="../index.html" id="btn-cerrar-sesion" class="btn">Cerrar sesión</a>
        </div>
    </header>

    <main class="dashboard">

        <section class="encabezado_ranking">
            <div class="contenido_encabezado">
                <div class="mascota_ranking">
                    <img src="../img/mascota_trofeo.png" alt="Mascota de LingoWeb sosteniendo un trofeo">
                </div>

                <div class="info_ranking" aria-live="polite">
                    <h2 id="titulo-liga"></h2>
                    <p><strong id="descripcion-liga"></strong></p>
                </div>
            </div>
        </section>

        <label for="liga">Liga:</label>
        <select id="liga"></select>

        <p id="mensaje-vacio"></p>

        <table id="tabla-ranking">
            <caption>Clasificación semanal</caption>
            <thead>
                <tr>
                    <th scope="col">Puesto</th>
                    <th scope="col">Avatar</th>
                    <th scope="col">Usuario</th>
                    <th scope="col">XP</th>
                    <th scope="col" class="estado">Estado</th>
                </tr>
            </thead>

            <tbody id="cuerpo-ranking"></tbody>
        </table>

        <a href="../dashboard/index.html" class="btn btn_ranking">Volver a Cursos</a>
    </main>

    <footer>
        <p>2026 LingoWeb — Trabajo Práctico N.º 2, Programación Web 1, UNLaM</p>
    </footer>

    <script type="module" src="../js/ranking.js"></script>
</body>

</html>
