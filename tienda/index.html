<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rachas y tienda</title>
    <link rel="stylesheet" href="../dashboard/style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../fonts/fonts.css">
</head>
<body>

    <header class="header">
        <div class="imagotipo">
            <img class="isologo" src="../img/isotipo-lingoweb.svg" alt="imagotipo">
            <h1>LingoWeb</h1>
        </div>

        <nav class="menu_principal">
            <a href="../dashboard/index.html">Cursos</a>
            <a href="../perfil/index.html">Perfil</a>
            <a href="../ranking/index.html">Clasificación</a>
            <a href="index.html" class="activo">Rachas/Tienda</a>
        </nav>

        <div class="resumen_usuario">
            <span id="racha">🔥 0 Días</span>
            <span id="xp-total">⚡ 0 XP</span>
            <span id="gemas">💎 0</span>
            <a href="../index.html" class="btn cerrar-sesion">Cerrar sesión</a>
        </div>
    </header>

    <main class="tienda-page">

        <section class="tienda-banner">
            <img class="mascota_banner" src="../img/mascota.webp" alt="mascota_de_lingoweb">
            <div class="banner-texto">
                <h2 id="tienda_racha"></h2>
                <p id="tienda_meta"></p>
            </div>
        </section>

        <section class="tienda-seccion">
            <h2>Tienda</h2>
            <p id="saldo"></p>

            <label for="filtro_productos">Mostrar:</label>
            <select id="filtro_productos">
                <option value="todos">Todos</option>
                <option value="vidas">Vidas</option>
                <option value="potenciadores">Potenciadores</option>
            </select>

            <!-- Los productos los genera tienda.js a partir de los datos -->
            <div id="lista_productos"></div>
        </section>

    </main>

    <footer>
        <p>2026 LingoWeb — Trabajo Práctico N.º 2, Programación Web 1, UNLaM</p>
    </footer>

    <!-- Plantilla de un producto (el navegador no la muestra) -->
    <template id="plantilla-producto">
        <div class="tienda-item">
            <span class="tienda-icono" aria-hidden="true"></span>
            <div class="tienda-info">
                <h3><span class="tienda-nombre"></span> <span class="tienda-estado"></span></h3>
                <p></p>
            </div>
            <button type="button" class="btn tienda-boton"></button>
        </div>
    </template>

    <script type="module" src="../js/tienda.js"></script>

</body>
</html>
