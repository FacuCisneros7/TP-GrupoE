<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lección Chino</title>
    <link rel="stylesheet" href="../dashboard/style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../fonts/fonts.css">
</head>
<body>

    <header class="header">
        <a href="../unidades/index3.html" class="btn">Abandonar</a>
        <div class="barra-progreso">
            <div class="barra-progreso-relleno"></div>
        </div>
        <p>Vidas: ❤️❤️❤️</p>
    </header>

    <main class="dashboard">
        <section class="seccion_game">
            <h2>Traduce esta frase</h2>
            <p>"早上好，你好吗？"</p>
            
            <div class="palabras_elegidas">
                <p class="palabra_correcta">Buenos</p>
                <p class="palabra_correcta">días</p>
                <p class="palabra_correcta">¿cómo</p>
                <p class="palabra_correcta">estás?</p>
            </div>
            <hr>
            <div class="contenedor_banco">
                <h3>Banco de palabras disponibles</h3>
                <div class="palabras_banco">
                    <p class="disponible">Adiós</p>
                    <p class="elegida">estás?</p>
                    <p class="elegida">¿cómo</p>
                    <p class="elegida">días</p>
                    <p class="elegida">Buenos</p>
                    <p class="disponible">Gracias</p>
                </div>
            </div>
            <a href="" class="btn">Comprobar Respuesta</a>
        </section>
        <section class="seccion_resultado_correcto">
            <div class="resultado_info_correcto">
                <div class="resultado_icono_correcto">✔</div>               
                <h2>¡Bien!</h2>
            </div>
            <div>
                <a href="../unidades/index3.html" class="btn">Abandonar</a>
                <a href="" class="btn_continuar_correcto">Continuar</a>
            </div>
        </section>
    </main>
</body>
</html>
