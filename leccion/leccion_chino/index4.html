<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lección Chino</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../../fonts/fonts.css">
</head>
<body>

    <header class="header">
    <a href="../../unidades/index2.html" class="btn_abandonar">Abandonar</a>

    <div class="info_leccion">
        <p class="curso">Chino · Unidad 1 · Lección 1</p>
        <div class="barra_progreso">
            <div class="barra_progreso_0"></div>
        </div>
        <p class="ejercicio">Ejercicio 2 de 2</p>
    </div>

    <p class="vidas">Vidas: ❤️❤️</p>
    </header>

    <main class="main">
        <section class="seccion_game">
            <h2>Resultado</h2>
            <p>"我 很好，谢谢"</p>
            
            <div class="palabras_elegidas">
                <p class="palabra_correcta">Estoy</p>
                <p class="palabra_correcta">muy</p>
                <p class="palabra_correcta">bien,</p>
                <p class="palabra_incorrecta">adiós</p>
            </div>

            <div class="contenedor_banco">
                <h3>Palabras</h3>
                <div class="palabras_banco">
                    <p class="elegida">Estoy</p>
                    <p class="elegida">bien,</p>
                    <p class="disponible">Ayer</p>
                    <p class="elegida">adiós</p>
                    <p class="disponible">gracias</p>
                    <p class="elegida">muy</p>
                </div>
            </div>
            <button href="" class="btn" disabled>Comprobar Respuesta</button>
        </section>  
        <section class="seccion_resultado_incorrecto">
            <div class="resultado_info_incorrecto">
                <div class="resultado_icono_incorrecto">&times;</div>               
                <h2>¡Incorrecto!</h2>
            </div>
            <div>
                <a href="../leccion_finalizada/index3.html" class="btn_continuar_incorrecto">Finalizar</a>
            </div>
        </section>
    </main>
