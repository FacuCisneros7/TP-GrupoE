<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Lección Chino</title>
    <link rel="stylesheet" href="../style.css">

<body>

    <header class="header">
        <div class="barra_progreso">
            <div class="barra_progreso_50"></div>
        </div>
        <p>Vidas: ❤️❤️</p>

    <main class="main">
        <section class="seccion_game">
            <h2>Resultado</h2>
            <p>"早上好，你好吗"</p>
            
            <div class="palabras_elegidas">

            <div class="contenedor_banco">

                    <p class="disponible">Adiós</p>
                    <p class="elegida">estás?</p>

            <button href="" class="btn" disabled>Comprobar Respuesta</button>
        </section>  
        <section class="seccion_resultado_incorrecto">
            <div class="resultado_info_incorrecto">
                <div class="resultado_icono_incorrecto">&times;</div>               
                <h2>¡Incorrecto!</h2>

            <div class="botones">
