<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lección Inglés</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../../fonts/fonts.css">
</head>
<body>

    <header class="header">
        <div class="barra_progreso">
            <div class="barra_progreso_100"></div>
        </div>
        <p>Vidas: ❤️❤️❤️</p>
    </header>

    <main class="main">
        <section class="seccion_game">
            <h2>Resultado</h2>
            <p>"I want to eat rice"</p>
            
            <div class="palabras_elegidas">
                <p class="palabra_correcta">Quiero</p>
                <p class="palabra_correcta">comer</p>
                <p class="palabra_correcta">arroz</p>
            </div>
            <div class="contenedor_banco">
                <h3>Palabras</h3>
                <div class="palabras_banco">
                    <p class="disponible">carne</p>
                    <p class="disponible">No</p>
                    <p class="elegida">comer</p>
                    <p class="elegida">arroz</p>
                    <p class="elegida">Quiero</p>
                    <p class="disponible">tomar</p>
                </div>
            </div>
            <button href="" class="btn" disabled>Comprobar Respuesta</button>
        </section>  
        <section class="seccion_resultado_correcto">
            <div class="resultado_info_correcto">
                <div class="resultado_icono_correcto">&times;</div>               
                <h2>¡Bien!</h2>
            </div>
            <div>
                <a href="../../unidades/index.html" class="btn_continuar_correcto">Finalizar</a>
            </div>
        </section>
    </main>

</html>
