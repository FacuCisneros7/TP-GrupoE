<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lección Aleman</title>
    <link rel="stylesheet" href="../dashboard/style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../fonts/fonts.css">
</head>
<body>

    <header class="header">
        <a href="../unidades/index2.html" class="btn">Abandonar</a>
        <div class="barra-progreso">
            <div class="barra-progreso-relleno"></div>
        </div>
        <p>Vidas: ❤️❤️❤️</p>
    </header>

    <main class="dashboard">
        <section class="seccion_game">
            <h2>Traduce esta frase</h2>
            <p>"Ich mag Frühstück"</p>
            
            <div class="palabras_elegidas">
                <p class="palabra_correcta">Me</p>
                <p class="palabra_correcta">gusta</p>
                <p class="palabra_incorrecta">la</p>
                <p class="palabra_incorrecta">cena</p>
            </div>
            <hr>
            <div class="contenedor_banco">
                <h3>Banco de palabras disponibles</h3>
                <div class="palabras_banco">
                    <p class="elegida">cena</p>
                    <p class="elegida">la</p>
                    <p class="disponible">desayuno</p>
                    <p class="elegida">Me</p>
                    <p class="disponible">el</p>
                    <p class="elegida">gusta</p>
                </div>
            </div>
            <a href="" class="btn">Comprobar Respuesta</a>
        </section>  
        <section class="seccion_resultado_incorrecto">
            <div class="resultado_info_incorrecto">
                <div class="resultado_icono_incorrecto">&times;</div>               
                <h2>¡Incorrecto!</h2>
            </div>
            <div>
                <a href="../unidades/index2.html" class="btn">Abandonar</a>
                <a href="" class="btn_continuar_incorrecto">Continuar</a>
            </div>
        </section>
    </main>
</body>
</html>
