<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lección Ingles</title>
    <link rel="stylesheet" href="../dashboard/style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../fonts/fonts.css">
</head>
<body>

    <header class="header">
        <a href="../unidades/index.html" class="btn">Abandonar</a>
        <div class="barra-progreso">
            <div class="barra-progreso-relleno"></div>
        </div>
        <p>Vidas: ❤️❤️❤️</p>
    </header>

    <main class="dashboard">
        <section class="seccion_game">
            <h2>Traduce esta frase</h2>
            <p>"I would like to order a pizza"</p>
            
            <div class="palabras_elegidas">
                <p class="palabra">Quisiera</p>
                <p class="palabra">pedir</p>
                <p class="palabra">una</p>
                <p class="palabra">pizza</p>
            </div>
            <hr>
            <div class="contenedor_banco">
                <h3>Banco de palabras disponibles</h3>
                <div class="palabras_banco">
                    <p class="disponible">hola</p>
                    <p class="elegida">pizza</p>
                    <p class="elegida">Quisiera</p>
                    <p class="disponible">darte</p>
                    <p class="elegida">pedir</p>
                    <p class="elegida">una</p>
                </div>
            </div>
            <a href="" class="btn">Comprobar Respuesta</a>
        </section>  
        <section class="seccion_resultado_correcto">
            <div class="resultado_info_correcto">
                <div class="resultado_icono_correcto">✔</div>               
                <h2>¡Bien!</h2>
            </div>
            <div>
                <a href="../unidades/index.html" class="btn">Abandonar</a>
                <a href="" class="btn_continuar_correcto">Continuar</a>
            </div>
        </section>
    </main>
</body>
</html>
